# Typecheck, then the structural gates on the built graph. `npm test` builds
# first via pretest, so a workflow that fails the SDK's validator fails here
# before any assertion runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
